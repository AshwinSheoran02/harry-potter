<title>The Battle for the Wizarding World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: a walnut table fills the screen; the printed board sits tilted in the middle, player plaques on the left rail, the dice tray and spell box on the right rail. */
:root {
  color-scheme: dark;
  --wood-0: #140c07;
  --wood-1: #26170e;
  --wood-2: #3a2416;
  --brass: #c9a24d;
  --brass-hi: #f2d68c;
  --brass-lo: #7d5f22;
  --ink: #f1e4c2;
  --ink-dim: #c9b88f;
  --parch: #efe0b4;
  --parch-ink: #3b1d0c;
  --board-brown: #7f2b0a;
  --harry: #b3261e;
  --harry-gold: #e3b445;
  --voldy: #45d07a;
  --voldy-deep: #0f3a22;
  --felt: #4a1512;
  --shadow: rgba(0,0,0,.55);
  --f-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-body: "Crimson Pro", Georgia, "Times New Roman", serif;
  --f-label: "Cinzel", "Trajan Pro", Georgia, serif;
  --tilt: 22deg;
  --bw: 900px;
  --ds: 58px;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--wood-0); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; overflow: hidden;
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
}
button { font-family: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 3px; }

/* ---------- table ---------- */
#app { position: fixed; inset: 0; }
#table { position: absolute; inset: 0; background-color: var(--wood-1); background-size: 900px 900px; }
#table::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 70% 60% at 50% 42%, rgba(255,214,150,.16), transparent 62%), radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.62) 100%); }
#stage { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(190px, 230px) 1fr minmax(190px, 230px); gap: 12px;
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 1; }
.rail { display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; justify-content: center; }
#boardArea { position: relative; min-width: 0; min-height: 0; perspective: 1900px; perspective-origin: 50% 30%; overflow: visible; touch-action: none; }
#boardCam { position: absolute; left: 50%; top: calc((100% - var(--reserve, 72px)) / 2); width: 0; height: 0; transform-style: preserve-3d; }
#boardTilt { position: absolute; transform-style: preserve-3d; transform-origin: 50% 50%; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
#slab { position: relative; width: var(--bw); aspect-ratio: 2048 / 1557; transform-style: preserve-3d; border-radius: 6px;
  box-shadow: 0 2px 0 #b89d63, 0 30px 60px rgba(0,0,0,.55), 0 10px 18px rgba(0,0,0,.45); background: #d9c48f; }
#slab::before { /* board thickness: front edge */
  content: ""; position: absolute; left: 0; right: 0; top: 100%; height: calc(var(--bw) * .016); transform-origin: top center; transform: rotateX(-90deg);
  background: linear-gradient(#a98f5a, #6f5a33 60%, #4a3a20); border-radius: 0 0 6px 6px; }
#boardImg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 6px; display: block; max-width: none; pointer-events: none; }
#slab .sheen { position: absolute; inset: 0; border-radius: 6px; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,250,230,.0) 30%, rgba(255,250,230,.13) 45%, rgba(255,250,230,0) 60%), radial-gradient(ellipse at 50% 0%, rgba(255,235,190,.12), transparent 60%); mix-blend-mode: screen; }
#slab .edgeShade { position: absolute; inset: 0; border-radius: 6px; pointer-events: none; box-shadow: inset 0 0 calc(var(--bw)*.03) rgba(60,30,5,.35), inset 0 0 0 1px rgba(80,50,10,.4); }
.layer { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; }
#devSvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* nodes */
.node { position: absolute; width: calc(var(--bw) * .052); height: calc(var(--bw) * .052); margin: calc(var(--bw) * -.026) 0 0 calc(var(--bw) * -.026);
  border-radius: 50%; pointer-events: auto; cursor: default; }
.node.hot { cursor: pointer; }
.node .ring { position: absolute; inset: -12%; border-radius: 50%; opacity: 0; transition: opacity .25s; }
.node.step .ring { opacity: 1; border: calc(var(--bw)*.0042) solid var(--hl, #ffd86b); box-shadow: 0 0 calc(var(--bw)*.012) var(--hl, #ffd86b), inset 0 0 calc(var(--bw)*.012) var(--hl, #ffd86b); animation: pulse 1.3s ease-in-out infinite; }
.node.endpoint .ring { opacity: .85; border: calc(var(--bw)*.0025) dashed var(--hl, #ffd86b); }
.node.endpoint.step .ring { border-style: solid; }
.node.target .ring { opacity: .8; background: radial-gradient(circle, rgba(69,208,122,.32), transparent 70%); border: calc(var(--bw)*.002) solid rgba(69,208,122,.75); }
.node.target:hover .ring, .node.step:hover .ring, .node.endpoint:hover .ring { opacity: 1; background: radial-gradient(circle, rgba(255,240,180,.42), transparent 70%); }
.node.pick .ring { opacity: 1; border: calc(var(--bw)*.0042) solid #ffd86b; box-shadow: 0 0 calc(var(--bw)*.015) #ffd86b; animation: pulse 1.1s infinite; }
.node .lbl { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font: 700 calc(var(--bw)*.012) var(--f-label); color: #fff; background: rgba(20,10,5,.82); border-radius: 4px; padding: 1px 4px; display: none; }
.devIds .node .lbl { display: block; }
.dragMode .node { cursor: grab; } .dragMode .node .ring { opacity: .6; border: 2px dashed #6cf; }
.node.devSel .ring { opacity: 1 !important; border: 3px solid #6cf !important; box-shadow: 0 0 12px #6cf; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }

/* standing things */
.stand { position: absolute; transform-origin: 50% 100%; transform: rotateX(calc(-1 * var(--tilt))); pointer-events: none; }
.shadowSpot { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(ellipse, rgba(25,10,0,.55), rgba(25,10,0,0) 70%); }
.pieceWrap { position: absolute; transform-style: preserve-3d; transition: left .34s cubic-bezier(.4,.1,.3,1), top .34s cubic-bezier(.4,.1,.3,1); pointer-events: none; }
.pieceWrap .shadowSpot { width: calc(var(--bw)*.064); height: calc(var(--bw)*.036); left: calc(var(--bw)*-.032); top: calc(var(--bw)*-.018); transition: transform .34s; }
.pieceWrap .stand { width: calc(var(--bw)*.062); height: calc(var(--bw)*.103); left: calc(var(--bw)*-.031); top: calc(var(--bw)*-.103 + var(--bw)*.005); }
.pieceWrap .lift { position: relative; width: 100%; height: 100%; transition: transform .34s; }
.pieceWrap.hop .lift { animation: hop .34s ease-out; }
.pieceWrap.hop .shadowSpot { animation: hopShadow .34s ease-out; }
@keyframes hop { 0% { transform: translateY(0); } 45% { transform: translateY(-38%); } 100% { transform: translateY(0); } }
@keyframes hopShadow { 45% { transform: scale(.6); opacity: .5; } }
.pieceWrap svg { width: 100%; height: 100%; overflow: visible; display: block; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
.pieceWrap.active .aura { opacity: 1; }
.pieceWrap.armed .aura { opacity: 1; animation: armed 1.4s ease-in-out infinite; }
@keyframes armed { 50% { transform: translate(-50%,-50%) scale(1.35); } }
.pieceWrap .heldWand { position: absolute; width: 70%; left: 62%; top: 22%; transform: rotate(-35deg); display: none; filter: drop-shadow(0 0 6px #ffd86b); }
.pieceWrap.armed .heldWand { display: block; }
.aura { position: absolute; left: 50%; top: 50%; width: calc(var(--bw)*.08); height: calc(var(--bw)*.05); transform: translate(-50%,-50%); border-radius: 50%; opacity: 0; transition: opacity .4s; pointer-events: none; }
#pH .aura { background: radial-gradient(ellipse, rgba(255,200,90,.6), transparent 70%); }
#pV .aura { background: radial-gradient(ellipse, rgba(69,208,122,.6), transparent 70%); }
.shielded .lift { opacity: .55; }
.shielded .stand::after { content: ""; position: absolute; inset: -12% -30%; border-radius: 50%; border: 2px solid rgba(180,220,255,.7); box-shadow: 0 0 14px rgba(180,220,255,.6); }
.stepBadge { position: absolute; left: 50%; top: -6%; transform: translate(-50%,-100%); font: 700 calc(var(--bw)*.017) var(--f-label); color: #2a1406;
  background: radial-gradient(circle at 35% 30%, #fff3c4, #e6b84e 60%, #9b7120); border-radius: 999px; min-width: calc(var(--bw)*.03); height: calc(var(--bw)*.03); display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.5); padding: 0 6px; }

.obst { position: absolute; transform-style: preserve-3d; pointer-events: none; }
.obst .shadowSpot { width: calc(var(--bw)*.05); height: calc(var(--bw)*.028); left: calc(var(--bw)*-.025); top: calc(var(--bw)*-.014); }
.obst .stand { width: calc(var(--bw)*.048); height: calc(var(--bw)*.066); left: calc(var(--bw)*-.024); top: calc(var(--bw)*-.066 + var(--bw)*.007); }
.obst svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 2px 2px rgba(0,0,0,.55)); }
.obst.rise .stand { animation: rise .7s cubic-bezier(.2,1.4,.4,1); }
@keyframes rise { from { transform: rotateX(calc(-1 * var(--tilt))) translateY(60%) scaleY(.1); opacity: 0; } }
.obst.pickable .stand { filter: drop-shadow(0 0 8px #ffd86b); }

.coinStack { position: absolute; transform-style: preserve-3d; pointer-events: none; }
.coinStack .stand { width: calc(var(--bw)*.03); height: calc(var(--bw)*.03); left: calc(var(--bw)*.012); top: calc(var(--bw)*-.012); }
.coinStack i { position: absolute; left: 0; width: 100%; height: 34%; border-radius: 50%; background: radial-gradient(ellipse at 40% 35%, #fff2b0, #e0b43c 45%, #9a6d12 80%); box-shadow: 0 2px 0 #7c560c, 0 3px 4px rgba(0,0,0,.4); }

.wandPiece { position: absolute; transform-style: preserve-3d; pointer-events: none; transition: left .5s, top .5s; }
.wandPiece .stand { width: calc(var(--bw)*.075); height: calc(var(--bw)*.06); left: calc(var(--bw)*-.0375); top: calc(var(--bw)*-.065); }
.wandPiece .float { width: 100%; height: 100%; animation: bob 2.6s ease-in-out infinite; }
.wandPiece svg { width: 100%; height: 100%; overflow: visible; }
.wandPiece .glow { position: absolute; left: calc(var(--bw)*-.045); top: calc(var(--bw)*-.03); width: calc(var(--bw)*.09); height: calc(var(--bw)*.06); border-radius: 50%; background: radial-gradient(ellipse, rgba(255,236,170,.7), transparent 70%); animation: glow 2.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-14%); } }
@keyframes glow { 50% { opacity: .5; transform: scale(.85); } }

/* ---------- plaques ---------- */
.plaque { position: relative; padding: 14px 14px 12px; border-radius: 14px;
  background: linear-gradient(160deg, #3b2617, #20130b 70%); box-shadow: inset 0 0 0 1px rgba(242,214,140,.25), inset 0 1px 0 rgba(255,230,170,.18), 0 10px 26px rgba(0,0,0,.55);
  transition: box-shadow .4s, transform .4s; }
.plaque::before { content: ""; position: absolute; inset: 5px; border-radius: 10px; border: 1px solid rgba(201,162,77,.35); pointer-events: none; }
.plaque.active { box-shadow: inset 0 0 0 1px rgba(242,214,140,.6), 0 0 0 2px var(--pc), 0 0 30px var(--pcg), 0 10px 26px rgba(0,0,0,.55); transform: translateX(3px); }
.plaque[data-p="H"] { --pc: #e3b445; --pcg: rgba(227,180,69,.35); }
.plaque[data-p="V"] { --pc: #45d07a; --pcg: rgba(69,208,122,.32); }
.pTop { display: grid; grid-template-columns: 54px 1fr; gap: 10px; align-items: center; }
.portrait { width: 54px; height: 64px; border-radius: 10px; background: radial-gradient(circle at 50% 35%, #5a3b22, #1a0f08); box-shadow: inset 0 0 0 2px var(--brass-lo), inset 0 0 12px rgba(0,0,0,.8); display: grid; place-items: end center; overflow: hidden; }
.portrait svg { width: 40px; height: 60px; }
.pName { font: 400 22px/1 var(--f-display); color: var(--brass-hi); letter-spacing: .02em; }
.pCpu { font: 700 9px/1 var(--f-label); letter-spacing: .2em; text-transform: uppercase; color: var(--pc); margin-top: 3px; }
.pCpu:empty { display: none; }
.pRole { font: 600 10px/1.3 var(--f-label); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); margin-top: 4px; }
.pStats { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.stat { display: inline-flex; align-items: center; gap: 6px; font: 700 17px var(--f-label); font-variant-numeric: tabular-nums; }
.coin { width: 22px; height: 22px; border-radius: 50%; display: inline-block; position: relative;
  background: radial-gradient(circle at 35% 30%, #fff6c8, #f0c64d 35%, #b8871d 70%, #7a560d); box-shadow: inset 0 0 0 2px rgba(122,86,13,.7), inset 0 0 0 4px rgba(255,230,150,.5), 0 2px 3px rgba(0,0,0,.5); }
.coin::after { content: "G"; position: absolute; inset: 0; display: grid; place-items: center; font: 700 11px var(--f-label); color: rgba(110,74,8,.85); }
.coinTower { display: inline-flex; flex-direction: column-reverse; margin-right: 2px; }
.coinTower i { width: 22px; height: 6px; border-radius: 50%; margin-top: -2px; background: linear-gradient(#f6d46a, #a87a16); box-shadow: 0 1px 0 #6b4a0b; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; min-height: 0; }
.chip { font: 600 11px/1 var(--f-label); letter-spacing: .06em; padding: 5px 8px; border-radius: 999px; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px rgba(242,214,140,.35); color: var(--ink); }
.chip.ice { box-shadow: inset 0 0 0 1px rgba(150,210,255,.6); color: #cfe9ff; }
.chip.bad { box-shadow: inset 0 0 0 1px rgba(255,120,100,.6); color: #ffd0c4; }
.chip.good { box-shadow: inset 0 0 0 1px rgba(120,230,160,.6); color: #d2ffe1; }
.hand { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.miniCard { width: 54px; height: 76px; border-radius: 6px; border: none; padding: 4px; cursor: default; position: relative;
  background: linear-gradient(160deg, #f5e7bf, #dcc690); box-shadow: inset 0 0 0 2px #b48a3a, inset 0 0 0 4px #f5e7bf, inset 0 0 0 5px #8a6420, 0 4px 8px rgba(0,0,0,.5);
  color: var(--parch-ink); font: 600 9px/1.05 var(--f-label); display: grid; place-items: center; text-align: center; transition: transform .2s; }
.miniCard.usable { cursor: pointer; animation: cardGlow 1.6s infinite; }
.miniCard.usable:hover { transform: translateY(-4px) rotate(-2deg); }
@keyframes cardGlow { 50% { box-shadow: inset 0 0 0 2px #b48a3a, inset 0 0 0 4px #f5e7bf, inset 0 0 0 5px #8a6420, 0 0 16px #ffd86b; } }
.wandStatus { margin-top: 12px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.3); box-shadow: inset 0 0 0 1px rgba(242,214,140,.25); }
.wandStatus svg { width: 46px; height: 16px; flex: none; }
.wandStatus .cd { font: 700 26px/1 var(--f-label); color: var(--brass-hi); font-variant-numeric: tabular-nums; }
.wandStatus .cdl { font: 600 10px/1.2 var(--f-label); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.wandStatus.urgent .cd { color: #ff8a6b; animation: pulse 1s infinite; }
.vsMark { text-align: center; font: 400 15px var(--f-display); color: var(--ink-dim); letter-spacing: .3em; }

/* ---------- right rail ---------- */
.tray { position: relative; border-radius: 18px; padding: 14px; background: linear-gradient(160deg, #4a2e1a, #2a180d); box-shadow: inset 0 0 0 1px rgba(242,214,140,.25), 0 12px 28px rgba(0,0,0,.55); }
.trayFelt { border-radius: 12px; padding: 16px 10px 10px; background: radial-gradient(ellipse at 50% 30%, #6d211b, var(--felt) 70%, #2c0b09); box-shadow: inset 0 6px 16px rgba(0,0,0,.7), inset 0 0 0 1px rgba(0,0,0,.6); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dieSlot { display: grid; justify-items: center; gap: 8px; padding-top: 6px; border: none; background: none; cursor: pointer; border-radius: 10px; padding-bottom: 6px; }
.dieSlot[disabled] { cursor: not-allowed; }
.dieSlot[disabled] .die { opacity: .45; filter: saturate(.5); }
.dieSlot.ready .die .cube { animation: idle 2.4s ease-in-out infinite; }
.dieSlot.ready:hover .die { transform: translateY(-6px); }
@keyframes idle { 50% { translate: 0 -4px; } }
.dieLabel { font: 700 11px/1.2 var(--f-label); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); text-align: center; }
.dieSub { font: 400 13px/1.2 var(--f-body); color: var(--ink-dim); text-align: center; min-height: 2.4em; }
.die { width: var(--ds); height: var(--ds); perspective: 600px; position: relative; transition: transform .25s, opacity .3s; margin-top: 4px; }
.die .dshadow { position: absolute; left: 6%; right: 6%; bottom: -14%; height: 22%; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.6), transparent 70%); transition: transform .3s; }
.die .cube { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(-20deg) rotateY(28deg); }
.die .cube .spin { position: absolute; inset: 0; transform-style: preserve-3d; }
.die .face { position: absolute; inset: 0; border-radius: 16%; backface-visibility: hidden; display: grid; place-items: center; }
.die .core { position: absolute; inset: 4%; transform-style: preserve-3d; }
.die .core i { position: absolute; inset: 0; background: var(--dcore, #e8dcc0); }
.dieH .face { background: radial-gradient(circle at 30% 25%, #fffaf0, #efe2c6 55%, #c9b48d); box-shadow: inset 0 0 0 1px rgba(120,90,40,.35), inset -3px -4px 8px rgba(110,80,30,.35); --pip: #9c1b14; --dcore: #e8dcc0; }
.dieV .face { background: radial-gradient(circle at 30% 25%, #4c5550, #1d2320 55%, #0b0e0d); box-shadow: inset 0 0 0 1px rgba(120,255,170,.18), inset -3px -4px 8px rgba(0,0,0,.6); --pip: #5cf08f; }
.dieV { --dcore: #151a18; }
.dieS .face { background: radial-gradient(circle at 30% 25%, #fff3cf, #e1bf68 50%, #9d7424); box-shadow: inset 0 0 0 1px rgba(90,60,10,.5), inset -3px -4px 8px rgba(90,60,10,.45); --pip: #3b1d0c; }
.dieS { --dcore: #b8913a; }
.dieS.dark .face { background: radial-gradient(circle at 30% 25%, #6a7d70, #23352a 55%, #0d1611); --pip: #66f39a; }
.dieS.dark { --dcore: #1a2a20; }
.pips { position: absolute; inset: 14%; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); }
.pips b { width: 64%; height: 64%; margin: auto; border-radius: 50%; background: radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--pip) 60%, #fff), var(--pip) 60%); box-shadow: inset 0 1px 2px rgba(0,0,0,.5); visibility: hidden; }
.pips b.on { visibility: visible; }
.dieV .pips b { box-shadow: 0 0 6px var(--pip); }
.face svg { width: 62%; height: 62%; }
.face svg * { fill: var(--pip); }
.rollResult { font: 700 14px var(--f-label); color: var(--brass-hi); min-height: 18px; letter-spacing: .08em; text-transform: uppercase; text-align: center; }

.deckRow { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; margin-top: 14px; }
.deck { width: 64px; height: 90px; position: relative; }
.deck .back { position: absolute; inset: 0; border-radius: 7px; }
.cardBack { background: radial-gradient(circle at 50% 50%, #5c1712 0 18%, transparent 19%), repeating-conic-gradient(from 0deg at 50% 50%, #3b0f0c 0 10deg, #4a1410 10deg 20deg); box-shadow: inset 0 0 0 2px #c9a24d, inset 0 0 0 5px #3b0f0c, inset 0 0 0 6px #8a6420, 0 2px 0 #20120a, 0 6px 10px rgba(0,0,0,.5); }
.cardBack::after { content: "✦"; position: absolute; inset: 0; display: grid; place-items: center; color: #e9c66c; font-size: 22px; }
.deckInfo { font: 600 11px/1.5 var(--f-label); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.deckInfo b { color: var(--ink); font-size: 18px; letter-spacing: 0; }
.railBtns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: none; cursor: pointer; padding: 10px 16px; border-radius: 999px; font: 700 12px/1 var(--f-label); letter-spacing: .12em; text-transform: uppercase;
  background: linear-gradient(#f3d98f, #c9a24d 55%, #8f6c25); color: #2a1406; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 3px 0 #5e4314, 0 6px 14px rgba(0,0,0,.45); transition: transform .12s, filter .2s; }
.btn:hover { filter: brightness(1.08); } .btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 1px 0 #5e4314; }
.btn.ghost { background: rgba(0,0,0,.35); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(242,214,140,.45); }
.btn.big { padding: 15px 28px; font-size: 14px; }
.btn.green { background: linear-gradient(#a5f5c2, #3fbf6b 55%, #1d7a40); color: #062312; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 3px 0 #0f4a26, 0 6px 14px rgba(0,0,0,.45); }

/* ---------- prompt ribbon / banner / toasts ---------- */

  padding: 10px 18px; border-radius: 12px; background: linear-gradient(#f3e5bd, #dcc58c); color: var(--parch-ink); box-shadow: 0 0 0 1px #8a6420, 0 0 0 4px rgba(30,15,5,.6), 0 10px 26px rgba(0,0,0,.55);

  return `<div class="side front"><div><div class="sigil">${SIGILS[CARD_SIGIL[cid]]}</div><div class="kind">${CARD_KIND(cid)}</div></div><div class="name">${c.name}</div><div class="text">${c.text}</div><div class="foot">Spell box · ${E.CARDS.indexOf(c) + 1} of 17</div></div>`;
}
async function showCard(cid, who, animateDraw) {
  const stage = $('#cardStage'); stage.classList.add('on');
  stage.innerHTML = `<div class="spellCard" id="sc"><div class="side back cardBack"></div>${cardFront(cid)}</div>`;
  const card = $('#sc'), deck = $('#deck').getBoundingClientRect();
  SFX.card();
  if (animateDraw && deck.width) {
    const cr = card.getBoundingClientRect(), dx = deck.left + deck.width / 2 - (cr.left + cr.width / 2), dy = deck.top + deck.height / 2 - (cr.top + cr.height / 2);
    await card.animate([{ transform: `translate(${dx}px, ${dy}px) scale(.25) rotateZ(-10deg)` }, { transform: 'translate(0,0) scale(1) rotateZ(0)' }], { duration: settings.fast ? 380 : 650, easing: 'cubic-bezier(.2,.8,.2,1)' }).finished.catch(() => {});
  }
  card.style.transform = 'rotateY(180deg)';
  await sleep(450); SFX.spell();
  const r = card.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, who === 'H' ? GOLD : GREEN, 50, 4, 60);
  const actions = $('#cardActions'); actions.hidden = false;
  const c = E.CARD_BY_ID[cid];
  actions.innerHTML = `<button class="btn big ${who === 'V' ? 'green' : ''}" id="castBtn">${c.hold ? 'Keep the card' : 'Cast ' + c.name}</button>`;
  $('#castBtn').focus({ preventScroll: true });
  const aiCard = aiControls();
  if (aiCard) $('#castBtn').disabled = true;
  castCurrent = async () => {
    castCurrent = null;
    while (busy) await new Promise(r => setTimeout(r, 50));
    actions.hidden = true;
    await card.animate([{ transform: 'rotateY(180deg)' }, { transform: 'rotateY(180deg) translateY(-30px) scale(1.05)', opacity: 1, offset: .4 }, { transform: 'rotateY(180deg) translateY(-120px) scale(.6)', opacity: 0 }], { duration: 500, easing: 'ease-in', fill: 'forwards' }).finished.catch(() => {});
    stage.classList.remove('on'); stage.innerHTML = '';
    act({ type: 'RESOLVE_CARD' }, aiCard);
  };
  $('#castBtn').onclick = () => { if (!aiCard && castCurrent) castCurrent(); };
  if (aiCard) scheduleAI(1500);
}

function rulesHTML() {
  return `<h2>How to Play</h2><p>Harry and Voldemort race across the grounds. Voldemort hunts Harry before he can reach the wand. Once Harry holds the wand, the hunt reverses: he has 15 moves to catch Voldemort.</p>
  <h3>Your turn</h3><ul><li>Roll one die per turn: the movement die or the special die, never both.</li><li>Harry's movement die moves 1 to 6 spaces. Voldemort's moves 1 to 3.</li><li>Move exactly the number rolled along the printed paths. You choose at every fork, and you cannot step back onto a space you already used this turn.</li><li>Click a glowing ring to take one step, or click a dashed ring to walk straight to that finishing space.</li></ul>
  <h3>Special die and obstacles</h3><ul><li>Rolling the special die costs 1 Galleon. Harry starts with 10, Voldemort with 5.</li><li>Voldemort raises an obstacle carved with the rolled symbol on any empty plain space. Never on money blocks, card blocks, the wand or an occupied space, and never two on one space. There are 15 obstacles in the box.</li><li>Harry breaks an obstacle only when his roll matches its symbol.</li><li>Obstacles stop movement: a piece halts in front of one.</li></ul>
  <h3>Money and spell cards</h3><ul><li>Each money block starts with 3 Galleons. Ending a move on one takes 1 Galleon.</li><li>Ending a move on a card block draws a spell from the spell box and casts it at once. Incendio, Reducio and Protego are kept in hand.</li><li>Using a money or card block freezes you for your next 5 moves. While frozen you cannot use either kind of block.</li></ul>
  <h3>Winning</h3><ul><li>Voldemort wins by catching Harry before Harry takes the wand, by walling Harry in with obstacles he cannot break, or if Harry fails to catch him within 15 moves of taking the wand.</li><li>Harry wins by catching Voldemort with the wand, or if Voldemort walls himself in.</li></ul>
  <h3>House rules in this edition</h3><ul><li>The rulebook leaves the special die faces open. This edition uses six symbols: Bolt, Flame, Serpent, Skull, Star and Moon.</li><li>A special die roll costs 1 Galleon. Harry may break any obstacle on the board whose symbol matches his roll.</li><li>Blocks trigger when a move ends on them. Taking the wand ends Harry's move, and the 15-move countdown starts with his next turn. A lost turn still counts as one of Harry's moves.</li><li>Before Harry holds the wand, pieces cannot pass through each other except for Voldemort catching Harry. Afterwards, only Harry can enter Voldemort's space.</li><li>Cards help the player who draws them. Expelliarmus only works when Voldemort draws it. Imperio means the caster picks the opponent's whole path next turn. Cloak and Evanesco protect you during the opponent's next turn. Protego rebounds the next curse your opponent draws at you.</li><li>A player is walled in when every neighbouring space holds an obstacle and they have no way to clear one: no free-removal card, and for Harry, no Galleons.</li></ul>
  <div class="row"><button class="btn" id="closeRules">Close</button></div>`;
}

  devOpen = on; $('#dev').hidden = !on; $('#devToggle').textContent = on ? 'Close developer mode' : 'Developer mode';
  if (!on) { settings.devFlat = false; document.body.classList.remove('devIds', 'dragMode'); $('#devSvg').innerHTML = ''; devSel = null; $$('.node.devSel').forEach(n => n.classList.remove('devSel')); fitBoard(); }

function escapeHtml(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function graphChanged() { for (const n of graph.nodes) if (nodeEls[n.id]) Object.assign(nodeEls[n.id].style, pct(n)); render(); devApply(); saveStore(); }
function devClickNode(id) {
  const m = devOpts.mode; if (m === 'none') return false;
  const dev = o => { const r = E.dispatch(S, graph, Object.assign({ type: 'DEV' }, o)); if (!r.error) { S = r.state; render(); saveStore(); if (S.winner) showEnd(); } };
  if (m === 'select' || m === 'drag') { devSel = id; renderDev(true); }
  if (m === 'edges') {
    if (edgeA == null) edgeA = id;
    else if (edgeA !== id) {
      const i = graph.edges.findIndex(([a, b]) => (a === edgeA && b === id) || (a === id && b === edgeA));
      if (i >= 0) { graph.edges.splice(i, 1); toast(`Connection ${edgeA}-${id} removed`); } else { graph.edges.push([Math.min(edgeA, id), Math.max(edgeA, id)]); toast(`Connection ${edgeA}-${id} added`); }
      graphEdited = true; edgeA = null; graphChanged();
    }
    renderDev(true);
  }
  if (m === 'tpH') dev({ op: 'teleport', who: 'H', node: id });
  if (m === 'tpV') dev({ op: 'teleport', who: 'V', node: id });
  if (m === 'obAdd') dev({ op: 'obstacle', node: id, symbol: devOpts.sym || 'skull' });
  if (m === 'obDel') dev({ op: 'obstacle', node: id, symbol: null });
  return true;
}
function onNodeDown(e, id) {
  if (!(devOpen && devOpts.mode === 'drag')) return;
  e.stopPropagation(); e.preventDefault(); drag = { id }; devSel = id; devApply();
}
function devDragMove(e) {
  const r = $('#slab').getBoundingClientRect(), n = graph.nodes.find(x => x.id === drag.id);
  n.x = Math.min(1, Math.max(0, +((e.clientX - r.left) / r.width).toFixed(4))); n.y = Math.min(1, Math.max(0, +((e.clientY - r.top) / r.height).toFixed(4)));
  Object.assign(nodeEls[n.id].style, pct(n)); drag.moved = true; devApply();
}
function devDragEnd() { if (drag.moved) { graphEdited = true; graphChanged(); renderDev(true); } drag = null; }
